<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Scan Topi - Live Web Detector</title>
    <meta name="description" content="Pindai wajah Anda secara langsung menggunakan kamera atau unggah foto untuk mendeteksi penggunaan topi menggunakan kecerdasan buatan CNN.">
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 28, 45, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-primary: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --accent-secondary: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --accent-danger: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glow-green: 0 0 25px rgba(16, 185, 129, 0.4);
            --glow-red: 0 0 25px rgba(244, 63, 94, 0.4);
            --glow-blue: 0 0 25px rgba(99, 102, 241, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Latar Belakang Gradien Bersinar Dekoratif */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 10%;
            left: -10%;
            z-index: -1;
            filter: blur(50px);
        }

        body::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, rgba(0,0,0,0) 70%);
            bottom: 5%;
            right: -10%;
            z-index: -1;
            filter: blur(60px);
        }

        main {
            width: 100%;
            max-width: 650px;
            padding: 20px;
            z-index: 1;
        }

        /* Container Card Glassmorphism */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Kamera & Preview Container */
        .viewer-container {
            width: 100%;
            aspect-ratio: 4/3;
            background-color: #0f1322;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video, img#image-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            display: none;
        }

        video.active, img#image-preview.active {
            display: block;
        }

        .video-placeholder {
            position: absolute;
            color: var(--text-muted);
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: opacity 0.3s;
        }

        /* Kamera Active Status Dot */
        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #64748b;
            border-radius: 50%;
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.3s;
        }

        .status-dot.active {
            background-color: #10b981;
            box-shadow: 0 0 12px #10b981;
            animation: pulse 1.8s infinite;
        }

        /* Tombol & Kontrol */
        .controls-frame {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #ffffff;
            text-decoration: none;
            outline: none;
        }

        .btn-primary {
            background: var(--accent-primary);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--glow-blue);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-secondary {
            background-color: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background-color: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        /* File Upload */
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-upload-input {
            position: absolute;
            font-size: 100px;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* Hasil Prediksi Box */
        .result-box {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 20px;
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .result-box.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .result-box.wearing-hat {
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: inset 0 0 20px rgba(16, 185, 129, 0.05);
        }

        .result-box.no-hat {
            border-color: rgba(244, 63, 94, 0.3);
            box-shadow: inset 0 0 20px rgba(244, 63, 94, 0.05);
        }

        .result-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 5px;
        }

        .result-value {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            transition: color 0.3s;
        }

        .result-box.wearing-hat .result-value {
            color: #10b981;
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .result-box.no-hat .result-value {
            color: #f43f5e;
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.2);
        }

        .confidence-bar-container {
            width: 100%;
            height: 6px;
            background-color: rgba(255,255,255,0.06);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .confidence-bar {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .result-box.wearing-hat .confidence-bar {
            background: var(--accent-secondary);
        }

        .result-box.no-hat .confidence-bar {
            background: var(--accent-danger);
        }

        .confidence-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Spinner Animasi Loading */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        /* Animasi */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 18px currentColor; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Responsive Layout */
        @media (max-width: 480px) {
            .card {
                padding: 20px;
            }
            h1 {
                font-size: 1.6rem;
            }
            .btn-group {
                flex-direction: column;
                width: 100%;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <main>
        <section class="card" id="scanner-container">
            <header>
                <h1>APLIKASI SCAN TOPI AI</h1>
                <p class="subtitle">Deteksi penggunaan topi secara langsung dengan webcam atau unggah foto</p>
            </header>

            <div class="viewer-container">
                <div class="status-dot" id="status-dot"></div>
                <video id="webcam" autoplay playsinline></video>
                <img id="image-preview" alt="Preview Gambar Unggahan">
                
                <div class="video-placeholder" id="placeholder">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                    <span>Kamera dinonaktifkan</span>
                </div>
            </div>

            <div class="controls-frame">
                <div class="btn-group">
                    <button class="btn btn-primary" id="btn-camera" onclick="toggleCamera()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        Nyalakan Kamera
                    </button>
                    <button class="btn btn-primary" id="btn-scan" onclick="captureAndScan()" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
                        Scan & Deteksi
                    </button>
                </div>

                <div class="btn-group">
                    <div class="file-upload-wrapper">
                        <button class="btn btn-secondary">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            Pilih Gambar File
                        </button>
                        <input type="file" class="file-upload-input" accept="image/*" onchange="handleFileUpload(event)">
                    </div>
                </div>
            </div>

            <!-- Loader Spinner -->
            <div style="display: flex; justify-content: center; margin-bottom: 20px;">
                <div class="spinner" id="loading-spinner"></div>
            </div>

            <!-- Output Hasil -->
            <article class="result-box" id="result-box">
                <p class="result-title">Hasil Analisis</p>
                <div class="result-value" id="result-text">-</div>
                <div class="confidence-bar-container">
                    <div class="confidence-bar" id="confidence-bar"></div>
                </div>
                <p class="confidence-text" id="confidence-text">Tingkat Keyakinan: -</p>
            </article>
        </section>
    </main>

    <!-- Hidden Canvas untuk capture snapshot dari webcam -->
    <canvas id="snapshot-canvas" style="display:none;" width="640" height="480"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const imgPreview = document.getElementById('image-preview');
        const placeholder = document.getElementById('placeholder');
        const statusDot = document.getElementById('status-dot');
        const btnCamera = document.getElementById('btn-camera');
        const btnScan = document.getElementById('btn-scan');
        const resultBox = document.getElementById('result-box');
        const resultText = document.getElementById('result-text');
        const confidenceBar = document.getElementById('confidence-bar');
        const confidenceText = document.getElementById('confidence-text');
        const spinner = document.getElementById('loading-spinner');
        const canvas = document.getElementById('snapshot-canvas');

        let stream = null;
        let isCameraActive = false;

        // Nyalakan / Matikan Kamera Web
        async function toggleCamera() {
            if (isCameraActive) {
                stopCamera();
            } else {
                try {
                    // Minta izin kamera
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { width: 640, height: 480, facingMode: 'user' } 
                    });
                    video.srcObject = stream;
                    video.classList.add('active');
                    imgPreview.classList.remove('active');
                    placeholder.style.opacity = '0';
                    statusDot.classList.add('active');
                    
                    isCameraActive = true;
                    btnCamera.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg> Matikan Kamera';
                    btnCamera.style.background = 'var(--accent-danger)';
                    btnScan.disabled = false;
                    
                    // Reset box hasil
                    resultBox.classList.remove('show');
                } catch (err) {
                    console.error("Gagal mengakses kamera:", err);
                    alert("Gagal mengakses kamera. Pastikan Anda telah memberikan izin kamera pada peramban.");
                }
            }
        }

        // Matikan Aliran Kamera
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            video.srcObject = null;
            video.classList.remove('active');
            placeholder.style.opacity = '1';
            statusDot.classList.remove('active');
            
            isCameraActive = false;
            btnCamera.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Nyalakan Kamera';
            btnCamera.style.background = 'var(--accent-primary)';
            btnScan.disabled = true;
        }

        // Capture snapshot dari live video feed dan scan ke backend
        function captureAndScan() {
            if (!isCameraActive) return;

            const ctx = canvas.getContext('2d');
            // Cerminkan snapshot horizontal agar sinkron dengan mirror effect camera
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.setTransform(1, 0, 0, 1, 0, 0); // Restore default transform

            const dataUrl = canvas.toDataURL('image/jpeg');

            showLoading(true);
            
            fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: dataUrl })
            })
            .then(res => res.json())
            .then(data => {
                showLoading(false);
                if (data.error) {
                    alert(data.error);
                } else {
                    displayResult(data.class, data.confidence);
                }
            })
            .catch(err => {
                showLoading(false);
                console.error(err);
                alert("Terjadi kesalahan koneksi ke server.");
            });
        }

        // Handle File Upload Manual
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Matikan kamera terlebih dahulu
            stopCamera();

            // Tampilkan preview gambar
            const reader = new FileReader();
            reader.onload = function(e) {
                imgPreview.src = e.target.result;
                imgPreview.classList.add('active');
                placeholder.style.opacity = '0';
            }
            reader.readAsDataURL(file);

            // Buat FormData untuk upload file
            const formData = new FormData();
            formData.append('file', file);

            showLoading(true);

            fetch('/predict', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                showLoading(false);
                if (data.error) {
                    alert(data.error);
                } else {
                    displayResult(data.class, data.confidence);
                }
            })
            .catch(err => {
                showLoading(false);
                console.error(err);
                alert("Terjadi kesalahan saat memproses file gambar.");
            });
        }

        // Tampilkan State Loading Spinner
        function showLoading(isLoading) {
            if (isLoading) {
                spinner.style.display = 'block';
                resultBox.classList.remove('show');
            } else {
                spinner.style.display = 'none';
            }
        }

        // Menampilkan Hasil Prediksi dengan Animasi & Glow
        function displayResult(predictedClass, confidence) {
            resultText.innerText = predictedClass;
            confidenceText.innerText = `Tingkat Keyakinan: ${confidence}%`;
            confidenceBar.style.width = `${confidence}%`;

            // Reset kelas visual
            resultBox.classList.remove('wearing-hat', 'no-hat');

            if (predictedClass === "Pakai Topi") {
                resultBox.classList.add('wearing-hat');
            } else {
                resultBox.classList.add('no-hat');
            }

            resultBox.classList.add('show');
        }
    </script>
</body>
</html>
